name: Upstream bump

# Weekly: look for a newer stable Hermes Agent release (vX.Y.Z, no canaries).
# Patches apply -> pull request that moves the submodule (its CI builds the zip).
# Patches fail  -> an issue listing the patches to refresh (docs/MAINTENANCE.md).
# Pull requests opened with GITHUB_TOKEN do not start workflows; set a BUMP_TOKEN
# secret (fine-grained PAT: contents + pull requests + issues) to get CI on them.

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

defaults:
  run:
    shell: bash

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.BUMP_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.BUMP_TOKEN || github.token }}

      - name: Latest upstream stable tag
        id: latest
        run: |
          latest=$(git ls-remote --tags --refs https://github.com/NousResearch/hermes-agent.git \
            | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          current=$(sed -n 's/^UPSTREAM_TAG=//p' build/bundle.conf)
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          newest=$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -n1)
          if [ "$latest" != "$current" ] && [ "$newest" = "$latest" ]; then
            echo "newer=true" >> "$GITHUB_OUTPUT"
          fi
          echo "current $current, latest $latest"

      - name: Move the submodule and check the patches
        id: check
        if: steps.latest.outputs.newer == 'true'
        env:
          TAG: ${{ steps.latest.outputs.latest }}
        run: |
          git -C upstream fetch --depth 1 origin tag "$TAG"
          git -C upstream -c advice.detachedHead=false checkout -q "$TAG"
          failed=()
          for patch in patches/*.patch; do
            git -C upstream apply --check "$PWD/$patch" 2>/dev/null || failed+=("$(basename "$patch")")
          done
          if [ ${#failed[@]} -gt 0 ]; then
            printf 'failed=%s\n' "${failed[*]}" >> "$GITHUB_OUTPUT"
          fi

      - name: Open a pull request
        if: steps.latest.outputs.newer == 'true' && steps.check.outputs.failed == ''
        env:
          TAG: ${{ steps.latest.outputs.latest }}
          CURRENT: ${{ steps.latest.outputs.current }}
        run: |
          branch="bump/upstream-$TAG"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "$branch already exists"; exit 0
          fi
          sed -i "s/^UPSTREAM_TAG=.*/UPSTREAM_TAG=$TAG/; s/^PORTABLE_REVISION=.*/PORTABLE_REVISION=1/" build/bundle.conf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add upstream build/bundle.conf
          git commit -m "Bump upstream Hermes Agent to $TAG"
          git push origin "$branch"
          gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" \
            --title "Bump upstream Hermes Agent to $TAG" \
            --body "Moves the \`upstream\` submodule from $CURRENT to [$TAG](https://github.com/NousResearch/hermes-agent/releases/tag/$TAG). All patches in \`patches/\` apply cleanly; CI builds and smoke-tests the zip. Review the upstream release notes for changes to PM, scripts/bundles or apps/desktop before merging (docs/MAINTENANCE.md)."

      - name: Report patches that need refreshing
        if: steps.check.outputs.failed != ''
        env:
          TAG: ${{ steps.latest.outputs.latest }}
          FAILED: ${{ steps.check.outputs.failed }}
        run: |
          title="Patches need refreshing for upstream $TAG"
          if [ -n "$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[].number')" ]; then
            echo "issue already open"; exit 0
          fi
          gh issue create --title "$title" --body "These patches no longer apply to upstream [$TAG](https://github.com/NousResearch/hermes-agent/releases/tag/$TAG):

          $(printf -- '- `%s`\n' $FAILED)

          Refresh them as described in docs/MAINTENANCE.md (Refreshing patches), then move the submodule and set \`UPSTREAM_TAG=$TAG\`, \`PORTABLE_REVISION=1\` in build/bundle.conf."
