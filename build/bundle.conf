# Hermes Portable build configuration (KEY=VALUE, same syntax as portable.env).

# Upstream stable release the `upstream` submodule is pinned to. Stable tags keep
# project.version 0.0.0 in pyproject.toml, so the version comes from here; the
# build checks that this tag really points at the pinned commit.
UPSTREAM_TAG=v0.22.5

# Release number on top of the upstream version: v<upstream>-p<PORTABLE_REVISION>.
# Reset to 1 when the upstream submodule moves to a new release.
PORTABLE_REVISION=2

# Optional PM packages left out of the payload (fnmatch patterns, comma separated).
# cua-driver is always excluded by patches/0001; required packages cannot be listed.
BUNDLE_EXCLUDE=llamacpp-*,gh,bws

# Ship the payload's uv wheel cache (offline venv rebuilds; roughly doubles the
# Python part of the zip). 0 = drop it; rebuilds then use the PyPI/Nexus sources.
INCLUDE_UV_CACHE=0

# Zip file prefix and the short top-level folder inside the zip (MAX_PATH).
DIST_NAME=Hermes-Portable
DIST_DIR_PREFIX=HermesP

# Release gates: GitHub release assets must stay under 2 GiB. MAX_REL_PATH bounds every
# path inside the zip (top folder included): a full Windows path holds 259 characters,
# so 235 leaves 24 for the extraction folder with its trailing backslash (C:\HP\ or
# D:\Tools\HP\). Baked .pyc caches beyond it are dropped by assemble.sh; upstream
# sources themselves reach about 235.
MAX_ZIP_BYTES=2093796556
MAX_REL_PATH=235
